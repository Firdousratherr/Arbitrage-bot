name: Clean maintenance-context fix

on:
  push:
    branches: [fix/maintenance-context-clean]

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Apply minimal ranking fix
        run: |
          awk '
            { print }
            /score \+= sum\(8 for term in terms if term in lowered_path\)/ {
              print "            for term in terms:"
              print "                if re.search(rf\"^\\s*(?:async\\s+)?def\\s+{re.escape(term)}\\b\", text, re.IGNORECASE | re.MULTILINE):"
              print "                    score += 1000"
            }
          ' app/maintenance.py > app/maintenance.py.tmp
          mv app/maintenance.py.tmp app/maintenance.py
          python -m py_compile app/maintenance.py

      - name: Run full tests
        run: pytest -q

      - name: Persist verified fix and remove workflow
        run: |
          rm -f .github/workflows/maintenance-clean-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/maintenance.py .github/workflows/maintenance-clean-fix.yml
          git commit -m "fix: prioritize callable definitions in maintenance search"
          git push origin HEAD:fix/maintenance-context-clean
