name: Mobile API Checks

on:
  push:
    branches:
      - "feat/arbihunt-style-android"
    paths:
      - "app/**"
      - "mobile_api/**"
      - "pyproject.toml"
      - "Dockerfile.mobile"
      - ".github/workflows/mobile-api.yml"
  pull_request:
    paths:
      - "app/**"
      - "mobile_api/**"
      - "pyproject.toml"
      - "Dockerfile.mobile"
      - ".github/workflows/mobile-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bot package and isolated API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install -r mobile_api/requirements.txt pytest
      - name: Run mobile API contract tests
        run: pytest -q mobile_api/tests
