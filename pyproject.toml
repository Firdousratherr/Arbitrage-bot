[project]
name = "telegram-arbitrage-terminal"
version = "1.0.0"
description = "Production-grade Telegram cross-exchange arbitrage terminal"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot>=20.8,<22","ccxt>=4.5.0","aiosqlite>=0.20.0","pydantic-settings>=2.6.0","httpx>=0.27.0"]
[project.scripts]
arbitrage-terminal = "arbitrage_terminal.main:run"
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.setuptools.packages.find]
where = ["src"]
